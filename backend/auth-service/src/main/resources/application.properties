# Server Configuration
server.port=8081

# Application Identity
spring.application.name=auth-service

# Database Connection (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/pms_auth_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Token Configuration (24-hour Expiration)
# Key name matches @Value("${jwt.secret}") and @Value("${jwt.expiration}") in JwtTokenProvider
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Eureka Discovery Client Setup
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true